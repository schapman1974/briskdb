<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">BriskDB data browser</title>
  <desc id="description">A dark green BriskDB admin interface showing the sharded orders table as one logical table.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100f"/>
      <stop offset="0.55" stop-color="#0a1715"/>
      <stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af4c4"/>
      <stop offset="1" stop-color="#2bc78f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#56e0ac" stop-opacity=".18"/>
      <stop offset="1" stop-color="#56e0ac" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #91aaa4; }
      .label { fill: #56e0ac; font-size: 12px; font-weight: 750; letter-spacing: 2px; }
      .heading { fill: #edf8f5; font-size: 28px; font-weight: 760; }
      .body { fill: #c7d8d3; font-size: 14px; }
      .small { font-size: 12px; }
      .cell { fill: #dceae6; font-size: 14px; }
      .type { fill: #78958d; font-size: 10px; font-weight: 650; letter-spacing: 1px; }
      .mono { fill: #9cc8bc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="22" fill="url(#background)"/>
  <circle cx="1270" cy="60" r="330" fill="url(#glow)"/>
  <circle cx="80" cy="850" r="330" fill="#3f8fc8" opacity=".05"/>

  <rect x="0.5" y="0.5" width="1439" height="899" rx="21.5" fill="none" stroke="#99c4b9" stroke-opacity=".18"/>
  <rect x="0" y="0" width="1440" height="72" rx="22" fill="#07100f" fill-opacity=".88"/>
  <path d="M0 72H1440" stroke="#99c4b9" stroke-opacity=".16"/>

  <rect x="24" y="17" width="38" height="38" rx="11" fill="url(#brand)"/>
  <text x="43" y="43" text-anchor="middle" fill="#04130e" font-size="16" font-weight="850">B</text>
  <text x="76" y="34" fill="#edf8f5" font-size="16" font-weight="760">BriskDB</text>
  <text x="76" y="51" class="muted small">Data Browser</text>

  <circle cx="1262" cy="36" r="5" fill="#56e0ac"/>
  <text x="1275" y="41" class="muted small">Connected</text>
  <rect x="1350" y="20" width="66" height="32" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#99c4b9" stroke-opacity=".28"/>
  <text x="1383" y="41" text-anchor="middle" class="body small">Log out</text>

  <rect x="0" y="72" width="270" height="828" fill="#081412" fill-opacity=".7"/>
  <path d="M270 72V900" stroke="#99c4b9" stroke-opacity=".16"/>
  <text x="24" y="112" class="label">LOGICAL DATABASE</text>
  <text x="24" y="141" fill="#edf8f5" font-size="16" font-weight="700">default</text>
  <text x="24" y="176" class="muted small">Sharded tables combine each</text>
  <text x="24" y="194" class="muted small">row-owning file. Global tables</text>
  <text x="24" y="212" class="muted small">are read once.</text>
  <path d="M20 244H250" stroke="#99c4b9" stroke-opacity=".16"/>

  <text x="24" y="282" class="label">APPLICATION TABLES</text>
  <rect x="222" y="263" width="28" height="22" rx="11" fill="#132522"/>
  <text x="236" y="278" text-anchor="middle" class="muted small">4</text>

  <text x="37" y="329" class="body">customers</text>
  <rect x="18" y="352" width="234" height="44" rx="9" fill="#56e0ac" fill-opacity=".09" stroke="#56e0ac" stroke-opacity=".2"/>
  <text x="37" y="380" fill="#56e0ac" font-size="14" font-weight="670">orders</text>
  <text x="37" y="433" class="body">products</text>
  <text x="37" y="486" class="body">shipments</text>

  <text x="314" y="121" class="label">LOGICAL DATABASE · DEFAULT</text>
  <text x="314" y="164" class="heading">orders</text>
  <text x="314" y="193" class="muted" font-size="14">Read-only logical rows across the table's metadata-selected files.</text>
  <text x="314" y="224" fill="#56e0ac" font-size="14" font-weight="680">2,486 records across 4 shards</text>

  <text x="1268" y="152" class="body small">Rows per page</text>
  <rect x="1266" y="163" width="126" height="42" rx="9" fill="#030d0b" fill-opacity=".72" stroke="#99c4b9" stroke-opacity=".28"/>
  <text x="1282" y="189" class="body">50</text>
  <path d="M1364 180l6 6 6-6" fill="none" stroke="#91aaa4" stroke-width="2"/>
  <text x="314" y="264" class="muted small">50 logical rows loaded from 4 files.</text>

  <g filter="url(#shadow)">
    <rect x="314" y="286" width="1078" height="528" rx="14" fill="#0e1c1a" fill-opacity=".95" stroke="#99c4b9" stroke-opacity=".18"/>
  </g>
  <path d="M314 358H1392M314 425H1392M314 492H1392M314 559H1392M314 626H1392M314 693H1392M314 760H1392" stroke="#99c4b9" stroke-opacity=".13"/>
  <path d="M560 286V760M800 286V760M970 286V760M1100 286V760" stroke="#99c4b9" stroke-opacity=".10"/>
  <rect x="315" y="287" width="1076" height="71" rx="13" fill="#0e1c1a"/>

  <text x="334" y="318" class="body" font-weight="730">id</text><text x="334" y="339" class="type">INTEGER</text>
  <text x="580" y="318" class="body" font-weight="730">customer</text><text x="580" y="339" class="type">TEXT</text>
  <text x="820" y="318" class="body" font-weight="730">status</text><text x="820" y="339" class="type">TEXT</text>
  <text x="990" y="318" class="body" font-weight="730">total</text><text x="990" y="339" class="type">REAL</text>
  <text x="1120" y="318" class="body" font-weight="730">created_at</text><text x="1120" y="339" class="type">TEXT</text>

  <text x="334" y="399" class="mono">4611686018427392001</text><text x="580" y="399" class="cell">Ada Lovelace</text><text x="820" y="399" fill="#7af4c4" font-size="14">shipped</text><text x="990" y="399" class="mono">149.95</text><text x="1120" y="399" class="cell">2026-08-13 09:41</text>
  <text x="334" y="466" class="mono">4611967493404102657</text><text x="580" y="466" class="cell">Grace Hopper</text><text x="820" y="466" fill="#f4d77a" font-size="14">processing</text><text x="990" y="466" class="mono">82.40</text><text x="1120" y="466" class="cell">2026-08-13 09:43</text>
  <text x="334" y="533" class="mono">4612248968380813313</text><text x="580" y="533" class="cell">Margaret Hamilton</text><text x="820" y="533" fill="#7af4c4" font-size="14">shipped</text><text x="990" y="533" class="mono">421.00</text><text x="1120" y="533" class="cell">2026-08-13 09:46</text>
  <text x="334" y="600" class="mono">4612530443357523969</text><text x="580" y="600" class="cell">Edsger Dijkstra</text><text x="820" y="600" class="cell">new</text><text x="990" y="600" class="mono">65.25</text><text x="1120" y="600" class="cell">2026-08-13 09:49</text>
  <text x="334" y="667" class="mono">4612811918334234625</text><text x="580" y="667" class="cell">Barbara Liskov</text><text x="820" y="667" fill="#f4d77a" font-size="14">processing</text><text x="990" y="667" class="mono">204.10</text><text x="1120" y="667" class="cell">2026-08-13 09:52</text>
  <text x="334" y="734" class="mono">4613093393310945281</text><text x="580" y="734" class="cell">Donald Knuth</text><text x="820" y="734" fill="#7af4c4" font-size="14">shipped</text><text x="990" y="734" class="mono">116.75</text><text x="1120" y="734" class="cell">2026-08-13 09:56</text>

  <text x="334" y="792" class="muted small">Showing rows 1–50</text>
  <rect x="1190" y="775" width="86" height="32" rx="8" fill="#fff" fill-opacity=".025" stroke="#99c4b9" stroke-opacity=".18"/>
  <text x="1233" y="796" text-anchor="middle" class="muted small">Previous</text>
  <rect x="1286" y="775" width="82" height="32" rx="8" fill="#fff" fill-opacity=".025" stroke="#99c4b9" stroke-opacity=".28"/>
  <text x="1327" y="796" text-anchor="middle" class="body small">Next</text>

  <text x="314" y="854" class="muted small">One logical view · four independent SQLite WAL files · served over HTTP</text>
</svg>
