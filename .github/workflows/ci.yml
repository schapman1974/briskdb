name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mongo_fuzz:
        description: Run the bounded, instrumented document and wire fuzz tier
        type: boolean
        required: false
        default: false
      mongo_soak:
        description: Run the opt-in ten-minute mixed Mongo CRUD and restart soak
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  mongo-soak:
    name: Mongo mixed CRUD and restart soak (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.mongo_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      BRISKDB_MONGO_SOAK_SECONDS: "600"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-wire-1.85

      - name: Require timed mixed CRUD and resource churn
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test --locked --no-default-features --features mongo --test mongo_wire \
            resource_churn::extended::timed_mixed_crud_restart_soak -- --ignored --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/mongo-soak.log"

      - name: Retain soak progress and outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mongo-soak.log
          if-no-files-found: warn
          retention-days: 7

  mongo-fuzz:
    name: Mongo document and wire fuzz (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.mongo_fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      FUZZ_TOOLCHAIN: nightly-2026-09-27
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchain and driver
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo +"$FUZZ_TOOLCHAIN" --version
          cargo fuzz --version

      - name: Compile locked targets
        run: cargo +"$FUZZ_TOOLCHAIN" check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Run every declared target with AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$FUZZ_TOOLCHAIN" fuzz list > "$RUNNER_TEMP/mongo-fuzz-targets.txt"
          test -s "$RUNNER_TEMP/mongo-fuzz-targets.txt"
          while IFS= read -r target; do
            if [[ ! "$target" =~ ^[a-z0-9_]+$ ]]; then
              echo "Unexpected fuzz target name" >&2
              exit 1
            fi
            cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" -- \
              -max_total_time=30 -max_len=4096 -timeout=10 \
              -rss_limit_mb=2048 -seed=186465 -print_final_stats=1
          done < "$RUNNER_TEMP/mongo-fuzz-targets.txt"
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

      - name: Retain generated corpus and failure reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts
            fuzz/corpus
            ${{ runner.temp }}/mongo-fuzz-targets.txt
          if-no-files-found: warn
          retention-days: 7

  mongo-contract:
    name: Mongo compatibility contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.9 replay environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The 3.9.6 harvest is preserved in the manifest. GitHub's Python
          # toolcache does not publish that patch for Ubuntu 24.04.
          python-version: "3.9.25"

      - name: Check out locked TinyMongo oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schapman1974/tinymongo
          ref: 53cbf44e98b8caa036163725d195fd29592e1cc0
          path: target/tinymongo-source
          persist-credentials: false

      - name: Install contract-only oracle dependencies
        run: |
          python -m pip install -r compat/mongo/v1/runner/requirements.txt
          python -m pip install --no-build-isolation --no-deps \
            ./target/tinymongo-source

      - name: Validate versioned Mongo contract
        run: python scripts/mongo_parity.py validate

      - name: Test Mongo contract harness
        run: python -m unittest discover -s tests -p 'test_mongo*.py' -v

      - name: Verify locked TinyMongo source
        run: >-
          python scripts/mongo_parity.py verify-source
          --source-root target/tinymongo-source

      - name: Execute owned fixtures against TinyMongo memory
        run: |
          mkdir -p target/mongo-parity
          python -m pytest -q -p no:cacheprovider -c /dev/null \
            compat/mongo/v1/runner/contracts \
            --mongo-contract-target=tinymongo \
            --mongo-contract-backend=memory \
            --mongo-contract-require-target \
            --junitxml=target/mongo-parity/tinymongo-memory.xml
          python scripts/mongo_parity.py ingest \
            --implementation tinymongo \
            --junit target/mongo-parity/tinymongo-memory.xml \
            --output target/mongo-parity/tinymongo-memory.json
          cmp compat/mongo/v1/reference-results.json \
            target/mongo-parity/tinymongo-memory.json

      - name: Install Rust 1.85 for candidate matcher conformance
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Restore matcher build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-matcher-1.85

      - name: Compare Rust document semantics with source-locked TinyMongo
        env:
          BRISKDB_MONGO_ORACLE_PYTHON: python
        run: >-
          cargo +1.85.0 test --locked --no-default-features --features documents
          --test document_matcher_oracle --test document_projection_oracle
          --test document_sorting_oracle --test document_distinct_oracle
          --test document_aggregation_oracle --test document_update_oracle
          --test document_upsert_oracle --test document_index_definition_oracle
          --test document_index_keys_oracle
          -- --ignored --nocapture

      - name: Verify differential reducer with source-backed fault injection
        env:
          BRISKDB_MONGO_ORACLE_PYTHON: python
        run: >-
          cargo +1.85.0 test --locked --no-default-features --features documents
          --test mongo_matcher_reproducer --test mongo_projection_reproducer
          --test mongo_update_reproducer source_backed_
          -- --ignored --nocapture

      - name: Generate full reference-only Mongo parity report
        run: |
          mkdir -p target/mongo-parity
          python scripts/mongo_parity.py report \
            --json-output target/mongo-parity/report.json \
            --markdown-output target/mongo-parity/report.md

      - name: Require stopped Mongo import, restore, and rollback drill
        env:
          BRISKDB_MONGO_ORACLE_PYTHON: python
          BRISKDB_MONGO_WIRE_PYTHON: ${{ github.workspace }}/target/mongo-operating-driver/bin/python
        run: |
          python -m venv target/mongo-operating-driver
          target/mongo-operating-driver/bin/python -m pip install pymongo==4.17.0
          cargo +1.85.0 test --locked --no-default-features --features mongo,tinymongo-import \
            --test mongo_operating_drill -- --ignored --nocapture --test-threads=1

      - name: Add Mongo parity report to summary
        if: always()
        run: |
          if [ -f target/mongo-parity/report.md ]; then
            cat target/mongo-parity/report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Mongo parity report was not generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Mongo parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-parity-report
          path: target/mongo-parity/*
          if-no-files-found: ignore
          retention-days: 14

  mongo-candidate:
    name: Mongo full frozen candidate corpus (456 executions)
    runs-on: ubuntu-24.04
    # Run independently of the long reference/oracle job. Both remain required;
    # no existing timeout, source contract, or intentional difference is relaxed.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.9 replay environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9.25"

      - name: Check out locked TinyMongo oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schapman1974/tinymongo
          ref: 53cbf44e98b8caa036163725d195fd29592e1cc0
          path: target/tinymongo-source
          persist-credentials: false

      - name: Install contract-only dependencies
        run: |
          python -m pip install -r compat/mongo/v1/runner/requirements.txt
          python -m pip install --no-build-isolation --no-deps ./target/tinymongo-source

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Restore candidate build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-candidate-full-1.85

      - name: Require all frozen contracts against BriskDB
        env:
          BRISKDB_MONGO_CONTRACT_PYTHON: python
          BRISKDB_MONGO_CONTRACT_REPORT: target/mongo-parity/candidate-full.xml
        run: |
          mkdir -p target/mongo-parity
          cargo +1.85.0 test --locked --no-default-features --features mongo \
            --test mongo_candidate_contract -- --ignored --nocapture
          python scripts/mongo_parity.py ingest --implementation briskdb \
            --junit target/mongo-parity/candidate-full.xml \
            --output target/mongo-parity/candidate-full.json

      - name: Upload full candidate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-full-candidate-results
          path: target/mongo-parity/candidate-full.*
          if-no-files-found: ignore
          retention-days: 14

  mongo-wire:
    name: Mongo real-wire discovery and documents (PyMongo 4.17.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Select Rust 1.85
        run: rustup default 1.85.0

      - name: Install Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-wire-1.85

      - name: Install pinned driver
        run: python -m pip install pymongo==4.17.0 'psycopg[binary]==3.2.13'

      - name: Test framing and loopback lifecycle
        run: |
          cargo test --locked --no-default-features --features mongo,tokio/rt-multi-thread --lib protocol::mongo
          cargo test --locked --no-default-features --features mongo --test mongo_wire --test mongo_compression
          cargo test --locked --no-default-features --features mongo --test mongo_wire_properties

      - name: Require real PyMongo discovery, documents, and restart
        env:
          BRISKDB_MONGO_WIRE_PYTHON: python
        run: |
          cargo test --locked --no-default-features --features mongo --test mongo_wire \
          real_pymongo_sync_async_discovery -- --ignored --exact
          cargo test --locked --no-default-features --features mongo --test mongo_wire \
          real_pymongo_async_cancellation -- --ignored --exact

      - name: Require bounded Mongo resource and failure churn
        run: |
          cargo test --locked --no-default-features --features mongo --test mongo_wire \
            resource_churn::bounded_resource_soak -- --ignored --exact --nocapture

      - name: Require independent Mongo TLS and verified PyMongo clients
        env:
          BRISKDB_MONGO_WIRE_PYTHON: python
        run: |
          cargo test --locked --no-default-features --features mongo-tls --test mongo_wire \
            tls:: -- --skip real_pymongo
          cargo test --locked --no-default-features --features mongo-tls --test mongo_wire \
            tls::real_pymongo_sync_async_tls_validation_and_crud -- --ignored --exact
          cargo test --locked --no-default-features --features mongo-tls --test mongo_wire \
            tls::reload::real_pymongo_uses_rotated_certificate_with_full_validation -- --ignored --exact

      - name: Require composed Mongo TLS, PostgreSQL SCRAM and SQLite-remote listeners
        env:
          BRISKDB_MONGO_WIRE_PYTHON: python
        run: |
          cargo test --locked --no-default-features --features listeners,mongo-tls,tokio/rt-multi-thread \
            --lib server::options::tests -- --include-ignored

      - name: Require real daemon TLS configuration, reload, clients and restart
        env:
          BRISKDB_MONGO_WIRE_PYTHON: python
        run: |
          cargo test --locked --no-default-features --features server-cli,mongo-tls \
            --bin briskdb --test mongo_server -- --include-ignored
          cargo test --locked --no-default-features --features server-cli \
            --bin briskdb --test mongo_server -- --include-ignored

  mongo-odm:
    name: Mongo real ODM and Talk Python applications
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned ODM Python environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.5"

      - name: Check out locked application fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schapman1974/tinymongo
          ref: 53cbf44e98b8caa036163725d195fd29592e1cc0
          # Authoritative fixtures are not build artifacts. A partial Rust cache
          # restore may clean target/ when the dependency key changes.
          path: .ci/tinymongo-odm-source
          persist-credentials: false

      - name: Install test-only ODM dependencies
        run: |
          python -m pip install -r tests/mongo_odm_requirements.txt
          python -m pip install --no-build-isolation --no-deps ./.ci/tinymongo-odm-source

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Restore ODM endpoint build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-odm-1.85

      - name: Verify locked fixtures after cache restoration
        run: |
          python scripts/mongo_parity.py verify-source --source-root .ci/tinymongo-odm-source
          python -m unittest discover -s tests -p 'test_mongo_odm_harness.py' -v
          python -m unittest discover -s tests -p 'test_mongo_talkpython_harness.py' -v

      - name: Require unchanged real ODM and Talk Python bodies and restart
        env:
          BRISKDB_MONGO_ODM_PYTHON: python
          BRISKDB_MONGO_ODM_SOURCE_ROOT: .ci/tinymongo-odm-source
          BRISKDB_MONGO_ODM_REPORT_DIR: target/mongo-odm
          BRISKDB_MONGO_TALKPYTHON_REPORT_DIR: target/mongo-talkpython
        run: >-
          cargo +1.85.0 test --locked --no-default-features --features mongo
          --test mongo_odm -- --ignored --nocapture --test-threads=1

      - name: Upload real ODM application results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-real-odm-results
          path: target/mongo-odm/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unchanged Talk Python wire contracts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongo-real-talkpython-results
          path: |
            target/mongo-talkpython/*.json
            target/mongo-talkpython/*.xml
          if-no-files-found: warn
          retention-days: 14

  mongo-server:
    name: Mongo daemon activation and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Restore daemon test build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mongo-server-1.85

      - name: Test disabled defaults and feature-absent rejection
        run: cargo +1.85.0 test --locked --bin briskdb --test mongo_server

      - name: Test opted-in daemon commands, signal shutdown and restart
        run: cargo +1.85.0 test --locked --features mongo --bin briskdb --test mongo_server

      - name: Test owned and borrowed Mongo listener lifecycle
        run: cargo +1.85.0 test --locked --features mongo --lib server::mongo::tests

  features:
    name: Features (${{ matrix.surface }}, Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - stable
        surface:
          - core
          - auth-scram
          - documents
          - mongo
          - embedded
          - listeners
          - http
          - postgres
          - sqlite-import
          - tinymongo-import
          - default
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal

      - name: Select Rust ${{ matrix.rust }}
        run: rustup default "${{ matrix.rust }}"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: features-${{ matrix.rust }}-${{ matrix.surface }}

      - name: Check feature surface
        run: |
          case "${{ matrix.surface }}" in
            core) cargo check --locked --lib --no-default-features ;;
            default) cargo check --locked --lib ;;
            *) cargo check --locked --lib --no-default-features --features "${{ matrix.surface }}" ;;
          esac

      - name: Verify embedded dependency boundary
        if: matrix.surface == 'embedded'
        run: |
          forbidden_dependencies="$(
            cargo tree --locked --no-default-features --features embedded --edges normal --prefix none |
              awk '$1 ~ /^(anyhow|axum|bson|clap|flate2|hyper|hyper-util|num-bigint|num-rational|num-traits|pgwire|time|tokio-util|tower|tracing-subscriber|utoipa|utoipa-axum|utoipa-gen)$/ { print $1 }' |
              sort -u
          )"
          if [ -n "$forbidden_dependencies" ]; then
            echo "embedded feature unexpectedly includes: $forbidden_dependencies"
            exit 1
          fi

      - name: Test shared permission decisions with core only
        if: matrix.surface == 'core'
        run: |
          cargo test --locked --no-default-features --features tokio/rt-multi-thread \
            --lib core::authorization
          cargo test --locked --no-default-features --doc core::authorization

      - name: Test shared SCRAM without networking adapters
        if: matrix.surface == 'auth-scram'
        run: |
          cargo test --locked --no-default-features --features auth-scram,tokio/rt-multi-thread \
            --lib core::authentication
          cargo test --locked --no-default-features --features auth-scram \
            --doc core::authentication
          forbidden_dependencies="$(
            cargo tree --locked --no-default-features --features auth-scram --edges normal --prefix none |
              awk '$1 ~ /^(anyhow|axum|bson|clap|flate2|hyper|hyper-util|pgwire|tokio-rustls|tokio-util|tower|tracing-subscriber|utoipa|utoipa-axum|utoipa-gen)$/ { print $1 }' |
              sort -u
          )"
          if [ -n "$forbidden_dependencies" ]; then
            echo "shared SCRAM unexpectedly includes: $forbidden_dependencies"
            exit 1
          fi

      - name: Test HTTP TLS without Mongo or daemon features
        if: matrix.surface == 'listeners'
        run: |
          cargo test --locked --no-default-features --features listeners,tokio/rt-multi-thread \
            --lib server::http_tls
          cargo test --locked --no-default-features --features listeners,tokio/rt-multi-thread \
            --lib core::engine::tests::weak_readiness_probe_tracks_live_gates_without_retaining_engine

  quality:
    name: Format and Clippy (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust with quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Select stable Rust
        run: rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-quality

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Compile document and wire fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Verify publishable crate package
        run: cargo package --locked --allow-dirty

      - name: Reject Git-sourced dependencies
        run: |
          if awk '/source = "git\+/{ found = 1 } END { exit !found }' Cargo.lock; then
            echo "Cargo.lock contains a Git-sourced dependency"
            exit 1
          fi

  test:
    name: Tests (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    # Full target tests plus the recovery/benchmark smoke matrix now exceed
    # twenty minutes on hosted runners. Keep all coverage and allow completion.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - stable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal

      - name: Select Rust ${{ matrix.rust }}
        run: rustup default "${{ matrix.rust }}"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-${{ matrix.rust }}

      - name: Run target tests
        run: cargo test --locked --all-targets --all-features

      - name: Run documentation tests
        run: cargo test --locked --doc --all-features

      - name: Run global-index benchmark correctness smoke
        if: matrix.rust == 'stable'
        run: >-
          cargo test --locked --test global_index_baseline
          global_index_baseline_smoke --
          --ignored --exact --test-threads=1

      - name: Run global-index release-gate correctness smoke
        if: matrix.rust == 'stable'
        run: >-
          cargo test --locked --test global_index_baseline
          global_index_release_gate_smoke --
          --ignored --exact --test-threads=1

      - name: Run global-index topology correctness smoke
        if: matrix.rust == 'stable'
        run: >-
          cargo test --locked --test global_index_topology
          global_index_topology_smoke --
          --ignored --exact --test-threads=1

  python:
    name: Python source build (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy

      - name: Select Rust 1.85
        run: rustup default 1.85.0

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/test-requirements.txt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python-${{ matrix.python }}

      - name: Install pinned build frontend
        run: python -m pip install maturin==1.14.1

      - name: Build wheel from source
        run: maturin build --manifest-path python/Cargo.toml --locked --out dist

      - name: Install wheel and run Python tests
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import importlib.util
          import tempfile

          assert importlib.util.find_spec("bson") is None
          assert importlib.util.find_spec("pymongo") is None
          import briskdb

          with tempfile.TemporaryDirectory() as root:
              with briskdb.open(root, shards=2) as database:
                  with database.session(routing_key="sql-only") as session:
                      assert session.query("SELECT 1")["rows"] == [(1,)]
              with briskdb.open(root, documents=True) as database:
                  with database.session(routing_key="sql-after-document-error") as session:
                      try:
                          session.create_collection("app", "must_not_commit")
                      except briskdb.UnsupportedError as error:
                          assert error.code == "unsupported"
                      else:
                          raise AssertionError("document call succeeded without PyMongo")
                      assert session.query("SELECT 2")["rows"] == [(2,)]
          PY
          python -m pip install -r python/test-requirements.txt
          python -m unittest discover -s python/tests -v

      - name: Check out locked index-model oracle
        if: matrix.python == '3.9'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schapman1974/tinymongo
          ref: 53cbf44e98b8caa036163725d195fd29592e1cc0
          path: target/tinymongo-model-source
          persist-credentials: false

      - name: Compare the installed wheel with isolated source-locked index models
        if: matrix.python == '3.9'
        env:
          BRISKDB_MONGO_ORACLE_PYTHON: ${{ runner.temp }}/mongo-model-oracle/bin/python
          BRISKDB_MONGO_ORACLE_SOURCE_ROOT: ${{ github.workspace }}/target/tinymongo-model-source
        run: |
          python -m venv "${{ runner.temp }}/mongo-model-oracle"
          "$BRISKDB_MONGO_ORACLE_PYTHON" -m pip install -r compat/mongo/v1/runner/requirements.txt
          "$BRISKDB_MONGO_ORACLE_PYTHON" -m pip install --no-build-isolation --no-deps ./target/tinymongo-model-source
          # Source-only collection imports DuckDB; never install it in the candidate.
          # 1.4.4 retains Python 3.9 wheels for this reference job.
          "$BRISKDB_MONGO_ORACLE_PYTHON" -m pip install duckdb==1.4.4
          python -m unittest discover -s python/tests -p test_index_models_reference.py -v
          python -m unittest discover -s python/tests -p test_index_suite_inventory.py -v
          python -m unittest discover -s python/tests -p test_query_suite_inventory.py -v
          python -m unittest discover -s tests -p test_mongo_benchmark.py -v
          python scripts/mongo_benchmark.py \
            --briskdb-python "$(command -v python)" \
            --tinymongo-python "$BRISKDB_MONGO_ORACLE_PYTHON" \
            --documents 32 --operations 4 --trials 1 --shards 2 --workers 2 \
            --output "${{ runner.temp }}/mongo-benchmark-smoke.json"

      - name: Test and lint the native extension
        run: |
          cargo test --locked -p briskdb-python
          cargo clippy --locked -p briskdb-python --all-targets --no-deps -- -D warnings

      - name: Verify Python dependency boundary
        run: |
          forbidden_dependencies="$(
            cargo tree --locked -p briskdb-python --edges normal --prefix none |
              awk '$1 ~ /^(clap|tracing-subscriber)$/ { print $1 }' |
              sort -u
          )"
          if [ -n "$forbidden_dependencies" ]; then
            echo "Python extension unexpectedly includes: $forbidden_dependencies"
            exit 1
          fi

  postgres-clients:
    name: PostgreSQL client matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Select Rust 1.85
        run: rustup default 1.85.0

      - name: Install Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/postgres_client_requirements.txt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: postgres-client-matrix

      - name: Install PostgreSQL and Python clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install -r tests/postgres_client_requirements.txt
          psql --version
          python -c "import psycopg, sqlalchemy; print('psycopg', psycopg.__version__); print('SQLAlchemy', sqlalchemy.__version__)"

      - name: Run the live client matrix
        run: bash tests/postgres_client_matrix.sh
