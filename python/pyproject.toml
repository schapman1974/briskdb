[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "briskdb"
dynamic = ["version"]
description = "In-process sharded SQLite through BriskDB's native Rust engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["BRISKDB_LICENSE.txt"]
authors = [{ name = "BriskDB contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Repository = "https://github.com/schapman1974/briskdb"
Issues = "https://github.com/schapman1974/briskdb/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "briskdb._briskdb"
features = ["pyo3/extension-module"]
strip = true
include = [
    { path = "API.md", format = "sdist" },
    { path = "ASYNC_API.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "COMPATIBILITY.md", format = "sdist" },
    { path = "BRISKDB_LICENSE.txt", format = "sdist" },
    { path = "PUBLISHING.md", format = "sdist" },
    { path = "SERVERLESS.md", format = "sdist" },
    { path = "VALUE_CONVERSIONS.md", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
